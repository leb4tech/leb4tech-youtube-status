name: Review official incident statuses
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Check status without changing live feed
        run: python3 scripts/verify_incidents.py
      - name: Upload independent review report
        uses: actions/upload-artifact@v4
        with:
          name: incident-status-review
          path: preview/incident-verification.json
          retention-days: 7
