name: Scheduled official incident review
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: write
concurrency:
  group: scheduled-incident-review
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Review incidents without publishing
        run: python3 scripts/verify_incidents.py
      - name: Prepare independent verified display feed
        run: python3 scripts/build_verified_feed.py
      - name: Commit verified feed only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-status.json
          if git diff --cached --quiet; then
            echo "No reviewed-feed changes."
          else
            git commit -m "Refresh independent reviewed YouTube status feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload review report
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-incident-review
          path: preview/incident-verification.json
          retention-days: 7
