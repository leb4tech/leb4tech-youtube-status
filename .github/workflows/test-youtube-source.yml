name: Test YouTube Community Access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public YouTube Community page
        env:
          SOURCE_URL: https://support.google.com/youtube/threads?thread_filter=%28purpose%3Aknown_issue%29&hl=en
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          url = os.environ["SOURCE_URL"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (compatible; Leb4TechStatusMonitor/0.1)"}
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read(2_000_000).decode("utf-8", errors="replace")
                  print("HTTP:", response.status)
                  print("Final URL:", response.geturl())
                  print("Bytes read:", len(body.encode("utf-8")))
                  for label, token in [("Known Issue", "Known Issue"), ("FIXED", "FIXED"), ("YouTube", "YouTube")]:
                      print(label + " present:", token.lower() in body.lower())
                  print("Page preview:", " ".join(body[:350].split()))
          except urllib.error.HTTPError as exc:
              print("HTTP ERROR:", exc.code, exc.reason)
              raise
          except Exception as exc:
              print("FETCH ERROR:", type(exc).__name__, str(exc))
              raise
          PY
